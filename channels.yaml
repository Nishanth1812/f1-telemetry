version: 1
description: >-
  THE contract. Every field's metadata - unit, rate, width, dtype, range, noise model,
  sigma, quantisation, fault eligibility - is declared exactly once, here. Python
  dataclasses, the Parquet schema and the TypeScript types are all code-generated
  from this file by `uv run f1-codegen`; none of them is hand-maintained. Channel
  inventory follows PLAN.md section 5.2 group by group;
  per-corner signals are declared once with a `corners` list and expanded by the
  generator, never written out four times. Sizing is computed from this file, not
  estimated: at the rates below the dictionary carries 7160 channel-samples/s
  (28.6 kB/s, 103 MB/h raw at float32), which supersedes the ~4600/s estimate in
  PLAN.md section 5.2.

conventions:
  body_frame: x forward, y left, z up; right-handed
  length_m: m
  angle: deg unless the unit says otherwise
  rate_hz: >-
    samples per second; null means event-driven, in which case `event` is true
  corner_order: [FL, FR, RL, RR]
  event_channels: >-
    Published on occurrence rather than on a clock, so they carry `event: true` and
    `rate_hz: null`. Nothing downstream may schedule them on a fixed timer.
  fault_types: >-
    dropout, freeze, spike, step, gain, noise, quantise, swap, saturate, stale - the
    PLAN.md section 8.1 taxonomy. `swap` requires a non-empty `corners` list.
  provenance: >-
    Every channel carries one of three labels, and they mean different things. `fia_limit`
    means the channel's `range` is a regulation *operating limit* read out of a named
    clause of FIA 2026 Section C Issue 20 - a bound the car is required to stay inside,
    not the span of a sensor. `simulator_convention` means the underlying quantity is
    regulated but the values on the wire are this project's: the FIA requires eight forward
    ratios and a reverse gear, and does not say that reverse is the integer -1. `illustrative`
    means the numbers are ours outright: a simulator setting chosen to make the trace
    plausible, with no regulation behind it. Only `mgu_k_power_kw` is `fia_limit` today and
    only `gear` is `simulator_convention`; every other `range`, `rate_hz`,
    `noise_model`/`sigma` and `quantise` in this file is an illustrative simulator setting
    and should be read as one. A `fia_limit` range is a limit, not a measurement span, so
    it may be asymmetric about zero and is deliberately not widened to cover a fault-free
    signal sitting at the ceiling. No number here is a team measurement, and
    nothing in this file reproduces a real car's telemetry.


channels:
  - name: speed
    group: chassis
    unit: km/h
    rate_hz: 200
    dtype: float32
    range: [0.0, 400.0]
    noise_model: gaussian
    sigma: 0.1
    quantise: { bits: 16, full_scale: 400.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Ground-referenced vehicle speed, the driver-facing number.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: vx
    group: chassis
    unit: m/s
    rate_hz: 200
    dtype: float32
    range: [-10.0, 105.0]
    noise_model: gaussian
    sigma: 0.02
    quantise: { bits: 16, full_scale: 110.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Body-frame longitudinal velocity, from the chassis estimator.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: vy
    group: chassis
    unit: m/s
    rate_hz: 200
    dtype: float32
    range: [-30.0, 30.0]
    noise_model: gaussian
    sigma: 0.02
    quantise: { bits: 16, full_scale: 32.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Body-frame lateral velocity, from the chassis estimator.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: yaw_rate
    group: chassis
    unit: deg/s
    rate_hz: 200
    dtype: float32
    range: [-300.0, 300.0]
    noise_model: gaussian
    sigma: 0.05
    quantise: { bits: 14, full_scale: 300.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Yaw rate about the vertical axis, chassis-filtered.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: accel_lateral
    group: chassis
    unit: m/s^2
    rate_hz: 200
    dtype: float32
    range: [-60.0, 60.0]
    noise_model: gaussian
    sigma: 0.05
    quantise: { bits: 14, full_scale: 60.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Filtered lateral acceleration, the "lateral g" the dashboard shows.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: accel_longitudinal
    group: chassis
    unit: m/s^2
    rate_hz: 200
    dtype: float32
    range: [-70.0, 30.0]
    noise_model: gaussian
    sigma: 0.05
    quantise: { bits: 14, full_scale: 70.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Filtered longitudinal acceleration, negative under braking.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: roll
    group: chassis
    unit: deg
    rate_hz: 200
    dtype: float32
    range: [-6.0, 6.0]
    noise_model: gaussian
    sigma: 0.02
    quantise: { bits: 14, full_scale: 6.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Body roll angle, positive rolling to the right.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: pitch
    group: chassis
    unit: deg
    rate_hz: 200
    dtype: float32
    range: [-6.0, 6.0]
    noise_model: gaussian
    sigma: 0.02
    quantise: { bits: 14, full_scale: 6.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Body pitch angle, positive nose-up under braking.
    provenance: illustrative
    source: PLAN.md section 5.2 chassis group
    source_date: 2026-09-30

  - name: imu_accel_x
    group: imu
    unit: m/s^2
    rate_hz: 200
    dtype: float32
    range: [-80.0, 80.0]
    noise_model: gaussian
    sigma: 0.08
    quantise: { bits: 16, full_scale: 80.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Raw IMU specific force, forward. Includes gravity on the other axes.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: imu_accel_y
    group: imu
    unit: m/s^2
    rate_hz: 200
    dtype: float32
    range: [-80.0, 80.0]
    noise_model: gaussian
    sigma: 0.08
    quantise: { bits: 16, full_scale: 80.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Raw IMU specific force, leftward positive.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: imu_accel_z
    group: imu
    unit: m/s^2
    rate_hz: 200
    dtype: float32
    range: [-80.0, 80.0]
    noise_model: gaussian
    sigma: 0.08
    quantise: { bits: 16, full_scale: 80.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      Raw IMU specific force, upward positive, so the static value is +g and downforce
      reads as an increase.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: imu_gyro_x
    group: imu
    unit: deg/s
    rate_hz: 200
    dtype: float32
    range: [-1000.0, 1000.0]
    noise_model: gaussian
    sigma: 0.5
    quantise: { bits: 14, full_scale: 1000.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Raw IMU roll rate.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: imu_gyro_y
    group: imu
    unit: deg/s
    rate_hz: 200
    dtype: float32
    range: [-1000.0, 1000.0]
    noise_model: gaussian
    sigma: 0.5
    quantise: { bits: 14, full_scale: 1000.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Raw IMU pitch rate.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: imu_gyro_z
    group: imu
    unit: deg/s
    rate_hz: 200
    dtype: float32
    range: [-1000.0, 1000.0]
    noise_model: gaussian
    sigma: 0.5
    quantise: { bits: 14, full_scale: 1000.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Raw IMU yaw rate.
    provenance: illustrative
    source: PLAN.md section 5.2 imu group
    source_date: 2026-09-30

  - name: ice_rpm
    group: powertrain
    unit: rpm
    rate_hz: 100
    dtype: float32
    range: [0.0, 13500.0]
    noise_model: gaussian
    sigma: 8.0
    quantise: { bits: 16, full_scale: 13500.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      Internal combustion engine shaft speed. A separate channel from mgu_k_rpm by
      contract - a single "rpm" is a 2022 concept and produces nonsense on a 2026 car.
      The range is illustrative: C5.14 gives a team per-car high-rev setting rather than a
      fixed public threshold, so there is no published overall limit to quote and 13500 rpm
      is our stand-in.
    provenance: illustrative
    source: PLAN.md section 5.2 powertrain group and naming correction
    source_date: 2026-09-30

  - name: mgu_k_rpm
    group: powertrain
    unit: rpm
    rate_hz: 100
    dtype: float32
    range: [0.0, 35000.0]
    noise_model: gaussian
    sigma: 25.0
    quantise: { bits: 16, full_scale: 35000.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      MGU-K motor speed. Not on the ICE gear path, so it is free to spin far faster
      than the engine and the two must never be reported as one channel.
    provenance: illustrative
    source: PLAN.md section 5.2 powertrain group and naming correction
    source_date: 2026-09-30

  - name: gear
    group: powertrain
    unit: enum
    rate_hz: 100
    dtype: int8
    range: [-1, 8]
    noise_model: none
    sigma: 0.0
    fault_eligible: [dropout, freeze, step, spike, stale]
    description: >-
      ICE gearbox state: -1 reverse, 0 neutral, 1..8 forward. C9.6.1 fixes eight forward
      ratios and C9.7 requires the car to be drivable in reverse, so the gear *count* and the
      existence of reverse are the regulation's; the integer encoding is a simulator
      convention, as is the neutral value - no clause requires the car to select neutral in
      ordinary operation, and none of them writes -1 anywhere. Discrete state, so no
      gaussian noise or analogue quantisation.
    provenance: simulator_convention
    source: >-
      FIA 2026 Formula One Regulations Section C Issue 20 (2026-08-05), C9.6.1 (eight
      forward ratios) and C9.7 (reverse drivability),
      https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf
    source_date: 2026-10-02

  - name: throttle_pct
    group: powertrain
    unit: "%"
    rate_hz: 100
    dtype: float32
    range: [0.0, 100.0]
    noise_model: gaussian
    sigma: 0.2
    quantise: { bits: 12, full_scale: 100.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Driver throttle pedal travel as a percentage.
    provenance: illustrative
    source: PLAN.md section 5.2 powertrain group
    source_date: 2026-09-30

  - name: clutch_pct
    group: powertrain
    unit: "%"
    rate_hz: 100
    dtype: float32
    range: [0.0, 100.0]
    noise_model: gaussian
    sigma: 0.2
    quantise: { bits: 12, full_scale: 100.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      Clutch engagement. Launch, trailing throttle and the upshift boost-cut all route
      through it, so a gearbox trace without it is not believable.
    provenance: illustrative
    source: PLAN.md section 6 clutch model
    source_date: 2026-09-30

  - name: ice_torque_nm
    group: powertrain
    unit: Nm
    rate_hz: 100
    dtype: float32
    range: [-200.0, 400.0]
    noise_model: gaussian
    sigma: 1.0
    quantise: { bits: 14, full_scale: 400.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: ICE shaft torque, including negative engine braking.
    provenance: illustrative
    source: PLAN.md section 6 powertrain
    source_date: 2026-09-30

  - name: mgu_k_power_kw
    group: powertrain
    unit: kW
    rate_hz: 100
    dtype: float32
    range: [-350.0, 350.0]
    noise_model: gaussian
    sigma: 1.0
    quantise: { bits: 14, full_scale: 350.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      MGU-K electrical power at the motor, positive motoring, negative recuperating. The
      bounds are the rule's 350 kW in each direction - an operating limit, symmetric
      because recuperation is capped at the same figure as motoring, not a sensor span.
      C5.2.8 further constrains deployment by car speed and by mode; that is real
      regulation and this generator does not implement it, because Phase 0 is a noise-only
      signal generator with no energy model behind it.
    provenance: fia_limit
    source: >-
      FIA 2026 Formula One Regulations Section C Issue 20 (2026-08-05), C5.2.7,
      https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_20_-_2026-08-05.pdf
    source_date: 2026-09-30

  - name: boost_remaining_bar
    group: powertrain
    unit: bar
    rate_hz: 100
    dtype: float32
    range: [0.0, 8.5]
    noise_model: gaussian
    sigma: 0.02
    quantise: { bits: 14, full_scale: 8.5 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Pneumatic overpressure available to the ICE for turbo boost.
    provenance: illustrative
    source: PLAN.md section 6 powertrain
    source_date: 2026-09-30

  - name: eso_pct
    group: powertrain
    unit: "%"
    rate_hz: 100
    dtype: float32
    range: [0.0, 100.0]
    noise_model: gaussian
    sigma: 0.1
    quantise: { bits: 12, full_scale: 100.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      Energy state of charge on a synthetic 0-100% display scale. The FIA's 4 MJ maximum
      state-of-charge swing is not the store capacity or an established mapping to this
      percentage, so the range and scale remain illustrative.
    provenance: illustrative
    source: PLAN.md section 6 powertrain
    source_date: 2026-09-30

  - name: fuel_flow_kg_h
    group: powertrain
    unit: kg/h
    rate_hz: 100
    dtype: float32
    range: [0.0, 110.0]
    noise_model: gaussian
    sigma: 0.15
    quantise: { bits: 14, full_scale: 110.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: >-
      Fuel mass flow. One half of the energy-balance invariant; the other half is
      mgu_k_power_kw and the drag work. The range is illustrative because the regulation
      limits fuel *energy* flow, not mass flow. Converting that limit to kg/h requires
      the FIA-measured fuel energy density and lower heating value; this illustrative
      range is not that conversion.
    provenance: illustrative
    source: PLAN.md section 6 energy invariant
    source_date: 2026-09-30

  - name: aero_mode
    group: aero
    unit: enum
    rate_hz: 100
    dtype: int8
    range: [0, 1]
    noise_model: none
    sigma: 0.0
    fault_eligible: [dropout, freeze, step, spike, stale]
    description: Active aero state machine - 0 = Z-mode closed high downforce, 1 = X-mode open low drag.
    provenance: illustrative
    source: PLAN.md section 5.1 active aero
    source_date: 2026-09-30

  - name: fw_flap_deg
    group: aero
    unit: deg
    rate_hz: 100
    dtype: float32
    range: [-5.0, 25.0]
    noise_model: gaussian
    sigma: 0.05
    quantise: { bits: 14, full_scale: 25.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Front wing flap angle, moving through finite mechanical travel.
    provenance: illustrative
    source: PLAN.md section 5.1 active aero
    source_date: 2026-09-30

  - name: rw_flap_deg
    group: aero
    unit: deg
    rate_hz: 100
    dtype: float32
    range: [-10.0, 30.0]
    noise_model: gaussian
    sigma: 0.05
    quantise: { bits: 14, full_scale: 30.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
    description: Rear wing flap angle, moving through finite mechanical travel.
    provenance: illustrative
    source: PLAN.md section 5.1 active aero
    source_date: 2026-09-30

  - name: zone_id
    group: aero
    unit: enum
    rate_hz: 100
    dtype: int16
    range: [-1, 20]
    noise_model: none
    sigma: 0.0
    fault_eligible: [dropout, freeze, spike, stale]
    description: >-
      X-mode permission zone index, -1 where X-mode is not permitted. P4 supplies the
      track geometry that resolves it.
    provenance: illustrative
    source: PLAN.md section 5.1 active aero
    source_date: 2026-09-30

  - name: downforce_n
    group: aero
    unit: N
    rate_hz: 100
    dtype: float32
    range: [0.0, 30000.0]
    noise_model: gaussian
    sigma: 5.0
    quantise: { bits: 16, full_scale: 30000.0 }
    fault_eligible: [dropout, freeze, spike, step, gain, noise, quantise, saturate, stale]
