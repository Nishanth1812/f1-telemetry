name: full

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  UV_FROZEN: "1"

jobs:
  suite:
    name: full suite (slow lap, golden and invariant tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest
