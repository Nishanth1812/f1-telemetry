name: focused transport verification
on:
  push:
    branches: ["feat/verify-synthetic-batches"]
  workflow_dispatch:
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Full-rate transport regression
        run: uv run --frozen pytest -q tests/test_dashboard_rate.py
      - name: Focused style check
        run: |
          uv run --frozen ruff check tests/test_dashboard_rate.py
          uv run --frozen ruff format --check tests/test_dashboard_rate.py
